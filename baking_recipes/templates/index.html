{% extends "base.html" %}
{% block content %}

<h2>Список агентов</h2>

<div class="mb-3">
    <a class="btn btn-outline-light btn-sm" href="/">Все</a>
    <a class="btn btn-outline-warning btn-sm" href="/?level=Секретно">Секретно</a>
    <a class="btn btn-outline-danger btn-sm" href="/?level=Совершенно секретно">
        Совершенно секретно
    </a>
</div>

<table class="table table-dark table-striped">
    <tr>
        <th>ID</th>
        <th>Кодовое имя</th>
        <th>Уровень доступа</th>
        <th></th>
    </tr>

    {% for a in agents %}
    <tr>
        <td>{{ a.id }}</td>
        <td>{{ a.codename }}</td>
        <td>{{ a.access_level }}</td>
        <td>
            <a class="btn btn-info btn-sm" href="/agent/{{ a.id }}">Открыть</a>
        </td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
