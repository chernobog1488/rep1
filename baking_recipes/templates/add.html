{% extends "base.html" %}
{% block content %}

<h2>Новый агент</h2>

<form method="post">
    <input class="form-control mb-2" name="codename" placeholder="Кодовое имя">
    <input class="form-control mb-2" name="phone" placeholder="Телефон">
    <input class="form-control mb-2" name="email" placeholder="Email">

    <select class="form-control mb-3" name="access_level">
        <option>Секретно</option>
        <option>Совершенно секретно</option>
    </select>

    <button class="btn btn-success">Сохранить</button>
</form>

{% endblock %}
